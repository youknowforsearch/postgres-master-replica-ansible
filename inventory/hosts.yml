---
# Example inventory — copy to hosts.local.yml for real deployments (gitignored).
# Supports 1 master + N replicas. Add or remove hosts under postgresql-replica.

all:
  children:
    postgresql:
      children:
        postgresql-master:
          hosts:
            pg-master-01:
              ansible_host: 192.168.1.10
              bind_ip: 192.168.1.10
              pg_role: master

        postgresql-replica:
          hosts:
            pg-replica-01:
              ansible_host: 192.168.1.11
              bind_ip: 192.168.1.11
              pg_role: replica
            pg-replica-02:
              ansible_host: 192.168.1.12
              bind_ip: 192.168.1.12
              pg_role: replica
