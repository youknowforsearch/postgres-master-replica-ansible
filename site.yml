---
# =============================================================================
# PostgreSQL streaming replication — 1 master + N replicas
#
#   1. Preflight : LVM on the data disk, optional air-gapped Docker install.
#   2. Master    : PostgreSQL + postgres_exporter, users/databases.
#   3. Replica   : pg_basebackup from master, hot standby.
#   4. Verify    : replication slots/connections on the master.
# =============================================================================

- name: Preflight (LVM + air-gapped Docker)
  hosts: postgresql
  become: true
  roles:
    - lvm_preflight
    - docker_airgapped

- name: Deploy PostgreSQL master
  hosts: postgresql-master
  become: true
  roles:
    - postgresql

- name: Deploy PostgreSQL replicas
  hosts: postgresql-replica
  become: true
  serial: 1
  roles:
    - postgresql

- name: Verify replication
  hosts: postgresql-master
  become: true
  gather_facts: false
  vars:
    _expected_replicas: "{{ groups['postgresql-replica'] | default([]) | length }}"
  tasks:
    - name: Give replication a moment to establish
      ansible.builtin.wait_for:
        timeout: 10
      when: _expected_replicas > 0

    - name: Check replication status
      community.docker.docker_container_exec:
        container: postgres
        user: "70"
        command: >
          psql -U postgres -d {{ postgres_default_db | default('postgres') }} -x -c
          "SELECT client_addr, state, sync_state, sent_lsn, replay_lsn
           FROM pg_stat_replication;"
      register: replication_status
      changed_when: false
      when: _expected_replicas > 0

    - name: Show replication status
      ansible.builtin.debug:
        msg: "{{ replication_status.stdout_lines }}"
      when: _expected_replicas > 0

    - name: Assert all replicas are connected
      ansible.builtin.assert:
        that:
          - replication_status.stdout is search(hostvars[item]['bind_ip'])
        fail_msg: "Replica {{ item }} ({{ hostvars[item]['bind_ip'] }}) is not connected to the master."
      loop: "{{ groups['postgresql-replica'] | default([]) }}"
      when: _expected_replicas > 0
