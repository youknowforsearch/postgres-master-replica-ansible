---
- name: Apply auto-tuning from hardware profile
  ansible.builtin.include_tasks: tuning.yml
  when: postgres_auto_tune | bool

- name: Create required directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "70"
    group: "70"
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ postgres_config_dir }}"
    - "{{ postgres_log_dir }}"

- name: Deploy postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ postgres_config_dir }}/postgresql.conf"
    mode: "0640"
    owner: "70"
    group: "70"
  notify: Restart postgres

- name: Deploy pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    mode: "0640"
    owner: "70"
    group: "70"
  notify: Restart postgres

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_base_dir }}/docker-compose.yml"
    mode: "0640"

- name: Install logrotate
  ansible.builtin.package:
    name: logrotate
    state: present
  when: postgres_logrotate_enabled | bool

- name: Deploy PostgreSQL logrotate configuration
  ansible.builtin.template:
    src: logrotate-postgresql.j2
    dest: /etc/logrotate.d/postgresql
    mode: "0644"
  when: postgres_logrotate_enabled | bool

- name: Include master tasks
  ansible.builtin.include_tasks: master.yml
  when: pg_role == 'master'

- name: Include replica tasks
  ansible.builtin.include_tasks: replica.yml
  when: pg_role == 'replica'
